# O site e estatico: nao tem build. O GitHub Pages ja serve tudo em
# erezchalom-a18y.github.io/tefila-kadish/ — este arquivo so existe para o caso
# de o Netlify ser ligado tambem.
[build]
  publish = "."
  command = "echo 'site estatico — nada a compilar'"

# NAO redirecionar tudo para o index: o app busca sync/*.json e os audios por
# caminho relativo, e um catch-all devolveria HTML no lugar deles.

[[headers]]
  for = "/tefila-audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sync/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
