[build]
  publish = "."
  command = "echo 'Static site — no build step'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers for audio files (1 week)
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cache headers for HTML (no cache — always fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker (no cache)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
