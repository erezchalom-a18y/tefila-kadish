<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conferidor de sincronia — Kadish</title>
<style>
:root{--bg:#0f1115;--card:#191d25;--line:#2a3039;--txt:#e8eaed;--dim:#98a0ab;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--acc:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;z-index:10}
h1{font-size:16px;margin:0 0 10px}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);color:#0b1020;border-color:var(--acc);font-weight:600}
audio{width:100%;margin-top:10px}
.aviso{background:#3a2a10;border:1px solid #6b5220;color:#fde68a;padding:10px 12px;border-radius:8px;margin:10px 16px;font-size:13px}
main{padding:8px 16px 120px}
.v{background:var(--card);border:1px solid var(--line);border-left:4px solid transparent;border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.v:hover{border-color:var(--line);background:#1f242d}
.v.on{border-left-color:var(--acc);background:#1c2534}
.v.susp{border-left-color:var(--warn)}
.top{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim);margin-bottom:6px}
.heb{direction:rtl;text-align:right;font-size:23px;line-height:1.9;font-family:"Times New Roman",serif}
.tl{color:var(--dim);font-size:13px;font-style:italic;margin-top:4px}
.td{color:var(--dim);font-size:13px;margin-top:2px}
.vazio{color:#6b7280;font-size:12px}
.barra{position:fixed;bottom:0;left:0;right:0;background:#141821;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
kbd{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
.st{color:var(--dim);margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>Conferidor de sincronia — Kadish</h1>
  <div class="linha">
    <select id="sel"></select>
    <button id="ir">▶ tocar do verso atual</button>
    <button id="lento">velocidade 1.0×</button>
    <button id="recarregar">recarregar do GitHub</button>
    <button class="p" id="baixar">baixar JSON corrigido</button>
  </div>
  <audio id="a" controls preload="metadata"></audio>
</header>

<div class="aviso" id="msg">carregando…</div>
<main id="lista"></main>

<div class="barra">
  <span><kbd>espaço</kbd> toca/pausa</span>
  <span><kbd>M</kbd> marcar: o verso destacado começa AGORA</span>
  <span><kbd>←</kbd><kbd>→</kbd> volta/avança 2s</span>
  <span><kbd>↑</kbd><kbd>↓</kbd> verso anterior/seguinte</span>
  <span class="st" id="st"></span>
</div>

<script>
const BASE = 'https://raw.githubusercontent.com/erezchalom-a18y/tefila-kadish/refs/heads/main';
const OPCOES = [
  ['ashkenaz','yatom'],['ashkenaz','derabanan'],
  ['chabad','yatom'],['chabad','derabanan'],
  ['sefard','yatom'],['sefard','derabanan'],
  ['sefaradi','yatom'],['sefaradi','derabanan'],
];
const sel = document.getElementById('sel');
OPCOES.forEach(([n,t]) => {
  const o = document.createElement('option');
  o.value = n + '_' + t; o.textContent = n + ' · ' + t; sel.appendChild(o);
});

const a = document.getElementById('a');
const lista = document.getElementById('lista');
const msg = document.getElementById('msg');
const st = document.getElementById('st');
let dados = null, atual = 0, suspeitos = new Set();

const cons = h => (String(h).match(/[א-ת]/g) || []).length;
const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') + '.' + String(Math.floor((s%1)*10));

function marcarSuspeitos(){
  suspeitos = new Set();
  const t = dados.versos.map(v => (v.end - v.start) / Math.max(1, cons(v.hebrew)));
  const ord = [...t].sort((x,y)=>x-y);
  const med = ord[Math.floor(ord.length/2)] || 1;
  t.forEach((x,i) => { const r = x/med; if (r < 0.75 || r > 1.35) suspeitos.add(i); });
}

function desenhar(){
  marcarSuspeitos();
  lista.innerHTML = '';
  dados.versos.forEach((v,i) => {
    const d = document.createElement('div');
    d.className = 'v' + (i===atual?' on':'') + (suspeitos.has(i)?' susp':'');
    d.dataset.i = i;
    const dur = (v.end - v.start).toFixed(2);
    d.innerHTML =
      '<div class="top"><span>§' + v.n + (suspeitos.has(i) ? ' &nbsp;⚠ ritmo fora do padrão' : '') + '</span>' +
      '<span>' + fmt(v.start) + ' → ' + fmt(v.end) + ' &nbsp;(' + dur + 's)</span></div>' +
      '<div class="heb">' + (v.hebrew || '<span class="vazio">— sem hebraico —</span>') + '</div>' +
      (v.transliteration_pt ? '<div class="tl">' + v.transliteration_pt + '</div>' : '<div class="tl vazio">— sem transliteração —</div>') +
      (v.translation_pt ? '<div class="td">' + v.translation_pt + '</div>' : '<div class="td vazio">— sem tradução —</div>');
    d.onclick = () => { atual = i; a.currentTime = v.start; destacar(); };
    lista.appendChild(d);
  });
  destacar();
}

function destacar(){
  [...lista.children].forEach((el,i) => el.classList.toggle('on', i===atual));
  const el = lista.children[atual];
  if (el) el.scrollIntoView({block:'center', behavior:'smooth'});
  st.textContent = 'verso ' + (atual+1) + ' de ' + dados.versos.length + ' · ' + suspeitos.size + ' suspeito(s)';
}

async function carregar(){
  const id = sel.value;
  msg.textContent = 'carregando…';
  const sel_v = 'v=' + Date.now();
  try {
    const r = await fetch(BASE + '/sync/' + id + '_sync.json?' + sel_v, {cache:'no-store'});
    dados = await r.json();
  } catch(e) { msg.textContent = 'não consegui baixar o JSON: ' + e.message; return; }
  const [n,t] = id.split('_');
  a.src = BASE + '/tefila-audio/' + n + '/' + t + '.ogg?' + sel_v;
  atual = 0;
  const vazios = dados.versos.filter(v => !v.hebrew || v.hebrew.startsWith('[')).length;
  msg.textContent = vazios
    ? '⚠ este nussach ainda não tem o hebraico (' + vazios + ' versos vazios). Dá para ouvir, mas não dá para conferir.'
    : (dados.sync_status || '') + ' — ouça seguindo o texto. Quando o destaque atrasar ou adiantar, aperte M no momento certo.';
  desenhar();
}

a.addEventListener('loadedmetadata', () => {
  const d = a.duration;
  const esperado = dados && dados.audio_duration;
  if (esperado && Math.abs(d - esperado) > 0.3)
    msg.textContent = '\u26a0 o audio que carregou tem ' + d.toFixed(2) + 's, mas o JSON espera ' + esperado + 's. Clique em "recarregar do GitHub".';
});

a.addEventListener('timeupdate', () => {
  if (!dados) return;
  const t = a.currentTime;
  const i = dados.versos.findIndex(v => t >= v.start && t < v.end);
  if (i !== -1 && i !== atual) { atual = i; destacar(); }
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); a.paused ? a.play() : a.pause(); }
  else if (k === 'm') {
    e.preventDefault();
    const t = +a.currentTime.toFixed(2);
    const v = dados.versos[atual];
    v.start = t;
    if (atual > 0) dados.versos[atual-1].end = t;
    if (t >= v.end) v.end = Math.min(t + 1, dados.audio_duration);
    dados.sync_status = 'ajustado de ouvido';
    desenhar();
  }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); a.currentTime = Math.max(0, a.currentTime - 2); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); a.currentTime += 2; }
  else if (e.key === 'ArrowUp')    { e.preventDefault(); atual = Math.max(0, atual-1); a.currentTime = dados.versos[atual].start; destacar(); }
  else if (e.key === 'ArrowDown')  { e.preventDefault(); atual = Math.min(dados.versos.length-1, atual+1); a.currentTime = dados.versos[atual].start; destacar(); }
});

document.getElementById('ir').onclick = () => { a.currentTime = dados.versos[atual].start; a.play(); };
document.getElementById('lento').onclick = e => {
  const v = a.playbackRate <= 0.55 ? 1 : a.playbackRate <= 0.8 ? 0.5 : 0.75;
  a.playbackRate = v; e.target.textContent = 'velocidade ' + v.toFixed(2) + '×';
};
document.getElementById('baixar').onclick = () => {
  const b = new Blob([JSON.stringify(dados, null, 2) + '\n'], {type:'application/json'});
  const u = URL.createObjectURL(b);
  const l = document.createElement('a');
  l.href = u; l.download = sel.value + '_sync.json'; l.click();
  URL.revokeObjectURL(u);
};
document.getElementById('recarregar').onclick = carregar;
sel.onchange = carregar;
carregar();
</script>
</body>
</html>
