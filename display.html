<!doctype html><html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kadish · cartão do display</title>
<!--
  display.html — o cartão de 10 × 15 cm, para o display de mesa da sinagoga.

  Ele (11/09): "quero colocar a folha num display, 15cm de altura por 10cm de
  largura, me sugira 3 opções". O panfleto.html continua existindo e é A4, para
  parede; este é o cartãozinho que fica em cima da mesa, perto de quem senta.

  A distância de leitura MUDA TUDO. O A4 na parede é visto a um metro ou mais e
  por isso o código lá tem 80mm. Este fica a meio braço de distância, então o
  código pode ser menor — mas não pode ser pequeno: uma câmera de telefone pede
  uns 3 cm para ler com folga, e papel em cima de mesa pega reflexo.

  As três formas, por ?f=
    A  o código e mais nada   — quem passa, aponta e vai embora
    B  o código e três passos — quem senta e lê
    C  o Kadish e o código    — o hebraico primeiro; é uma sinagoga
    D  completa               — tudo o que a folha A4 diz, em duas colunas
    E  completa com o hebraico
    R  PARA O RABINO          — 14/09; ver a nota abaixo
    S  DISCRETA               — 14/09; o conteudo do A4 num 10x15 calado

  A FORMA R E DE OUTRO LEITOR, e e por isso que ela nao e a D com uma linha a
  mais. As formas A-E falam com QUEM REZA: "aponte a camera, acompanhe". O
  rabino nao precisa que lhe expliquem o que e um minyan — a nota do minyan,
  que nas outras e informacao, na dele e barulho, e por isso SAI. E ele tem uma
  pergunta que nenhuma das outras responde, e e a que decide se ele recomenda o
  app: **tem o nussach da minha casa?** Por isso os oito Kadishim ocupam o meio
  do cartao.

  Os quatro nomes de rito sao os MESMOS quatro botoes do alto do app, escritos
  igual — Ashkenazi · Chabad · Sefard · Sefaradi. Nao se traduzem em lugar
  nenhum do projeto (sao nomes proprios), entao aqui tambem nao. Quem puser o
  cartao ao lado da tela le a mesma palavra nos dois.

  A FORMA S ("discreta") e o pedido dele de 14/09, depois de escolher o A4 de
  parede: "quero esse texto num formato discreto em 10x15". Mesmo conteudo do
  A4; o que muda e o VOLUME DA VOZ.

  O que "discreto" quer dizer aqui nao e gosto meu: e a palavra dele, e ele ja
  a usou duas vezes neste projeto (o convite da dedicatoria, em 01/09 e 26/08).
  Das duas vezes significou a mesma coisa — sem caixa-alta, sem caixa em volta,
  sem risco, peso leve, uma linha so. Entao aqui:
    · a nota do minyan perde a CAIXA (fundo, borda e barra de latao) e vira
      uma linha calada no pe. A frase e a mesma, palavra por palavra.
    · os dois titulos das colunas perdem o negrito e ganham espacamento.
    · o QR perde a moldura E o quadrado branco, e fica em 40mm. O branco era
      a coisa mais berrante do cartao; e o codigo nao precisa dele, porque o
      fundo do proprio SVG ja e a cor do papel. Provado a 120/150/200/300 dpi.
  E o verso em hebraico NAO entra. O A4 o tem porque vai na parede; num cartao
  que fica deitado numa mesa isso e a pergunta de respeito ao texto sagrado que
  ja ficou anotada na forma C, e ela e do rabino, nao minha.

  ?lang=pt|en|es|fr|it|de|ru|he    Imprimir: abrir e mandar imprimir.
-->
<script src="./textos-impressos.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
  @page { size: 100mm 150mm; margin: 0; }
  :root{--bg:#f4ede0;--txt:#2a1f15;--soft:#4d3d2d;--fraco:#8a7860;--brass:#8b6a3e;--linha:#c9b894}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e2d4;font-family:Lora,Georgia,serif;color:var(--txt);
       display:flex;justify-content:center;padding:16px}
  .cartao{width:100mm;height:150mm;background:var(--bg);padding:8mm 7mm;
          box-shadow:0 6px 26px rgba(0,0,0,.18);display:flex;flex-direction:column;
          align-items:center;text-align:center;overflow:hidden}
  .marca{font-family:'Frank Ruhl Libre',serif;letter-spacing:.02em}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--soft);line-height:1.3}
  .regua{height:1px;width:54%;background:linear-gradient(to right,transparent,var(--brass),transparent);opacity:.65}
  .qr{border:1px solid var(--linha);border-radius:6px;background:#fff;display:block}
  .legenda{font-family:'Cormorant Garamond',serif;color:var(--soft);line-height:1.35}
  .endereco{font-family:'Cormorant Garamond',serif;color:var(--brass);font-weight:600;letter-spacing:.02em}
  .passo{display:flex;gap:7px;text-align:left;font-size:11px;line-height:1.35;margin-bottom:5px}
  .passo b{font-family:'Cormorant Garamond',serif;color:var(--brass);font-size:13px;flex:0 0 11px}
  .heb{font-family:'Frank Ruhl Libre',serif;direction:rtl;line-height:1.5}
  .heb-tl{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--soft)}
  .nota{font-family:'Cormorant Garamond',serif;color:var(--fraco);line-height:1.35}
  .rodape{margin-top:auto;font-family:'Cormorant Garamond',serif;color:var(--fraco)}

  /* ---- A · o codigo e mais nada ---- */
  .f-A .marca{font-size:25px}
  .f-A .sub{font-size:12.5px;margin-top:3px}
  .f-A .regua{margin:5mm 0 0}
  .f-A .qr{width:62mm;height:62mm;margin:6mm 0 0}
  .f-A .legenda{font-size:12.5px;margin-top:4mm}
  .f-A .endereco{font-size:17px;margin-top:2mm}

  /* ---- B · o codigo e tres passos ---- */
  .f-B .marca{font-size:21px}
  .f-B .sub{font-size:11px;margin-top:2px}
  .f-B .qr{width:46mm;height:46mm;margin:4mm 0 0}
  .f-B .endereco{font-size:14px;margin-top:2mm}
  .f-B .passos{margin-top:4mm;width:100%}
  .f-B .nota{font-size:10px;margin-top:3mm}

  /* ---- C · o Kadish e o codigo ---- */
  .f-C .heb{font-size:19px;margin-top:1mm}
  .f-C .heb-tl{font-size:11.5px;margin-top:1px}
  .f-C .regua{margin:4mm 0 0}
  .f-C .marca{font-size:16px;margin-top:4mm}
  .f-C .sub{font-size:11px;margin-top:2px}
  .f-C .qr{width:50mm;height:50mm;margin:4mm 0 0}
  .f-C .endereco{font-size:15px;margin-top:2mm}

  /* ---- D e E · as completas: tudo o que a folha A4 diz, no cartao ---- */
  .colunas{display:flex;gap:4mm;width:100%;text-align:left;margin-top:4mm}
  .col{flex:1;min-width:0}
  .col h2{font-family:'Cormorant Garamond',serif;font-size:11.5px;font-weight:600;
          color:var(--brass);margin:0 0 2px}
  .lista{margin:0;padding-left:11px;font-size:8.6px;line-height:1.32}
  .lista li{margin-bottom:1.6px}
  .nota-minyan{margin-top:3mm;padding:2mm 2.5mm;border-radius:5px;
               border:1px solid var(--linha);border-left:3px solid var(--brass);
               background:rgba(212,162,90,.10);font-size:8.4px;line-height:1.35;
               color:var(--soft);text-align:center}
  html[dir=rtl] .colunas{text-align:right}
  html[dir=rtl] .lista{padding-left:0;padding-right:11px}
  html[dir=rtl] .nota-minyan{border-left:1px solid var(--linha);border-right:3px solid var(--brass)}

  .h-unico{font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:600;
           color:var(--brass);letter-spacing:.06em;text-transform:uppercase;
           margin:4mm 0 0;text-align:center}
  .colunas{margin-top:2mm}
  .f-S .h-unico{font-weight:400;color:var(--fraco);letter-spacing:.09em}

  .f-D .marca{font-size:19px}
  .f-D .sub{font-size:9.6px;margin-top:2px}
  .f-D .qr{width:38mm;height:38mm;margin:3mm 0 0}
  .f-D .endereco{font-size:14px;margin-top:1.5mm}
  .f-D .passo{font-size:8.6px;line-height:1.32;margin-bottom:3px}
  .f-D .passo b{font-size:11px;flex:0 0 9px}

  .f-E .heb{font-size:15px}
  .f-E .heb-tl{font-size:9px}
  .f-E .regua{margin:2.5mm 0 0}
  .f-E .marca{font-size:17px;margin-top:2.5mm}
  .f-E .qr{width:34mm;height:34mm;margin:2.5mm 0 0}
  .f-E .endereco{font-size:13px;margin-top:1.5mm}
  .f-E .passo{font-size:8.4px;line-height:1.3;margin-bottom:3px}
  .f-E .passo b{font-size:10.5px;flex:0 0 9px}

  /* ---- R · para o rabino ----
     A conta da altura, para nao se refazer: 150mm menos 16mm de padding sao
     134mm uteis. Na primeira volta o QR tinha 42mm e sobravam VINTE E QUATRO
     milimetros de nada no pe do cartao — o mesmo defeito que eu tinha acabado
     de apontar no folheto do ChatGPT (meia folha vazia). Os 24mm foram para o
     CODIGO, que e a razao de o cartao existir: 57mm lidos a meio braco, e com
     folga contra o reflexo do papel na mesa.
     Se um dia faltar altura, quem encolhe e o QR, nunca a letra — 12px e o
     piso do projeto. */
  .f-R .marca{font-size:20px}
  .f-R .sub{font-size:10.5px;margin-top:2px}
  .f-R .regua{margin:3mm 0 0}
  .f-R .qr{width:57mm;height:57mm;margin:4mm 0 0}
  .f-R .endereco{font-size:15px;margin-top:2mm}
  .oito{margin-top:4.5mm;width:100%;text-align:center}
  .oito h2{font-family:'Cormorant Garamond',serif;font-size:12px;font-weight:600;
           color:var(--brass);margin:0 0 3px;letter-spacing:.03em}
  .oito .ritos{font-family:'Frank Ruhl Libre',serif;font-size:12px;letter-spacing:.02em;
               color:var(--txt)}
  .oito .tipos{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10.5px;
               color:var(--soft);margin-top:2px}
  .f-R .uma-col{margin-top:4mm;width:100%;text-align:left}
  .f-R .uma-col h2{font-family:'Cormorant Garamond',serif;font-size:12px;font-weight:600;
                   color:var(--brass);margin:0 0 3px}
  .f-R .lista{font-size:10px;line-height:1.4}
  html[dir=rtl] .f-R .uma-col{text-align:right}

  /* ---- S · discreta: o conteudo do A4, com a voz mais baixa ---- */
  .f-S .marca{font-size:20px;font-weight:400}
  .f-S .sub{font-size:10.2px;margin-top:3px;line-height:1.4}
  .f-S .regua{margin:4mm 0 0;width:38%;opacity:.5}
  /* Sem o quadrado branco: ele era a coisa MAIS berrante do cartao, o oposto
     do pedido. Nao e ousadia — o fundo do proprio qr/kadish.svg ja e o
     pergaminho (#f4ede0), entao tirar o branco do CSS apenas deixa o codigo
     no papel em que ele foi desenhado. Medido antes de ficar: lido de dentro
     do PDF a 120, 150, 200 e 300 dpi, e devolve o endereco nas quatro. */
  .f-S .qr{width:40mm;height:40mm;margin:4mm 0 0;border:0;background:transparent;padding:0}
  .f-S .endereco{font-size:14px;font-weight:500;margin-top:2.5mm;opacity:.9}
  .f-S .colunas{margin-top:5mm;gap:5mm}
  .f-S .col h2{font-weight:400;font-size:10.5px;letter-spacing:.09em;
               text-transform:uppercase;color:var(--fraco);margin:0 0 3px}
  .f-S .lista{font-size:8.8px;line-height:1.45;padding-left:10px}
  .f-S .lista li{margin-bottom:2.4px}
  .f-S .passo{font-size:8.8px;line-height:1.45;margin-bottom:3.5px;gap:6px}
  .f-S .passo b{font-weight:400;color:var(--fraco);font-size:10px;flex:0 0 8px}
  /* a nota do minyan sem caixa: mesma frase, sem moldura nem barra */
  .nota-calada{margin-top:4.5mm;font-family:'Cormorant Garamond',serif;font-style:italic;
               font-size:8.8px;line-height:1.4;color:var(--fraco);text-align:center;
               max-width:82%}
  html[dir=rtl] .f-S .lista{padding-left:0;padding-right:10px}

  .rodape{font-size:9.5px;padding-top:3mm}
  .imprimir{position:fixed;top:14px;right:14px;background:var(--brass);color:#fff;
            border:0;border-radius:8px;padding:9px 15px;font-family:Lora,serif;font-size:13px;cursor:pointer}
  @media print{ body{background:#fff;padding:0} .cartao{box-shadow:none} .imprimir{display:none} }
  html[dir=rtl] .passo{text-align:right}
</style></head>
<body>
<button class="imprimir" id="btImprimir">imprimir</button>
<div class="cartao" id="cartao"></div>
<script>
// Nas 8 linguas. As frases vem do panfleto.html — sao as MESMAS palavras, para
// o cartao e a folha nao dizerem coisas diferentes na mesma sinagoga.
const T = window.TEXTOS_IMPRESSOS;
const q = new URLSearchParams(location.search);
const lingua = (q.get('lang') || 'pt').toLowerCase();
const forma = (q.get('f') || 'A').toUpperCase();
const t = T[lingua] || T.pt;
document.documentElement.lang = lingua;
document.documentElement.dir = t.dir;
const esc = x => String(x).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const QR = '<img class="qr" src="./qr/kadish.svg" alt="QR">';
const ENDERECO = '<div class="endereco">kadish.app</div>';
// `nota` e a frase do minyan e `rodape` e o "Gratuito · sem cadastro" — sao
// campos diferentes na tabela compartilhada. Na primeira volta eu pus `nota`
// aqui e a frase do minyan saiu DUAS VEZES no mesmo cartao: na caixa e no
// rodape. A medida nao viu (nada transbordava); a foto viu.
const RODAPE = `<div class="rodape">${esc(t.rodape)}</div>`;
// Os quatro botoes do alto do app, escritos igual. Nomes proprios: nao se
// traduzem em lingua nenhuma do projeto, e por isso nao entram na tabela.
const RITOS = 'Ashkenazi &middot; Chabad &middot; Sefard &middot; Sefaradi';
const HEB = '<div class="heb">יִתְגַּדַּל וְיִתְקַדַּשׁ שְׁמֵהּ רַבָּא</div>' +
            '<div class="heb-tl">Yitgadal veyitkadash shemê raba</div>';
// 11/09 — "achei que ficou muito curto, favor incluir as explicacoes e mais
// features". As formas D e E poem no cartao o MESMO conteudo do A4: os tres
// passos, os cinco itens do que o app faz, e a nota do minyan. Cabe porque as
// duas listas vao LADO A LADO — 100mm de largura sao 86mm uteis, e empilhar as
// duas gastaria altura que o cartao nao tem.
// 14/09 — eram DUAS listas: "Como usar" (3 passos) e "O que o app faz" (5
// itens). Ele reescreveu o miolo como UMA sequencia de oito passos, e os cinco
// recursos viraram os passos 5 a 8. Manter as duas aqui punha 13 linhas onde
// cabiam 8: as formas D, E e S transbordaram e o gerador nao gravou nada —
// 19px, 16px e 103px da borda de baixo. O conserto nao e apertar a letra; e
// parar de dizer duas vezes a mesma coisa.
// O `oque` CONTINUA na tabela porque a forma R (o cartao do rabino) o usa —
// ali a pergunta e outra: nao "como uso?", mas "o que este app tem?".
// A partida e pela METADE da lista, calculada. Um 4 escrito a mao mentiria no
// dia em que entrasse ou saisse um passo.
const DUAS_COLUNAS = (t) => {
  const meio = Math.ceil(t.passos.length / 2);
  const passo = (p, i) => `<div class="passo"><b>${i+1}</b><span>${esc(p)}</span></div>`;
  return `<h2 class="h-unico">${esc(t.hComo)}</h2><div class="colunas">
   <div class="col">${t.passos.slice(0, meio).map((p,i)=>passo(p,i)).join('')}</div>
   <div class="col">${t.passos.slice(meio).map((p,i)=>passo(p,i+meio)).join('')}</div>
 </div>`;
};
const NOTA_MINYAN = (t) => `<div class="nota-minyan">${esc(t.nota)}</div>`;

const formas = {
 A: `<div class="marca">Kadish</div><div class="sub">${esc(t.sub)}</div>
     <div class="regua"></div>${QR}
     <div class="legenda">${esc(t.qr)}</div>${ENDERECO}${RODAPE}`,
 B: `<div class="marca">Kadish</div><div class="sub">${esc(t.sub)}</div>
     ${QR}${ENDERECO}
     <div class="passos">${t.passos.map((p,i)=>
        `<div class="passo"><b>${i+1}</b><span>${esc(p)}</span></div>`).join('')}</div>
     ${RODAPE}`,
 D: `<div class="marca">Kadish</div><div class="sub">${esc(t.sub)}</div>
     ${QR}${ENDERECO}${DUAS_COLUNAS(t)}${NOTA_MINYAN(t)}${RODAPE}`,
 E: `${HEB}<div class="regua"></div>
     <div class="marca">Kadish</div>
     ${QR}${ENDERECO}${DUAS_COLUNAS(t)}${NOTA_MINYAN(t)}${RODAPE}`,
 // 14/09 — o cartao do rabino. Sem a nota do minyan (ele sabe) e sem os tres
 // passos de "aponte a camera" (esses sao de quem reza). No lugar deles, a
 // pergunta que e dele: quais Kadishim este app tem.
 // Os itens do "o que o app faz" sao escolhidos por POSICAO (0,1,2,3), nunca
 // pelo texto: o titulo muda de lingua, o indice nao. Fica de fora so o 4, o
 // botao de mudo, que e o menos util para quem conduz a reza.
 R: `<div class="marca">Kadish</div><div class="sub">${esc(t.rab_sub)}</div>
     <div class="regua"></div>${QR}${ENDERECO}
     <div class="oito"><h2>${esc(t.rab_hOito)}</h2>
       <div class="ritos">${RITOS}</div>
       <div class="tipos">${esc(t.rab_yatom)} · ${esc(t.rab_derabanan)}</div></div>
     <div class="uma-col"><h2>${esc(t.hOque)}</h2><ul class="lista">${
        [0,1,2,3].map(i => `<li>${esc(t.oque[i])}</li>`).join('')}</ul></div>
     ${RODAPE}`,
 // 14/09 — a discreta. Mesmo conteudo da folha A4, volume mais baixo.
 // A nota do minyan e a MESMA frase da forma D; o que sai e a caixa em volta.
 S: `<div class="marca">Kadish</div><div class="sub">${esc(t.sub)}</div>
     <div class="regua"></div>${QR}${ENDERECO}${DUAS_COLUNAS(t)}
     <div class="nota-calada">${esc(t.nota)}</div>${RODAPE}`,
 C: `${HEB}<div class="regua"></div>
     <div class="marca">Kadish</div><div class="sub">${esc(t.sub)}</div>
     ${QR}${ENDERECO}${RODAPE}`,
};
const cx = document.getElementById('cartao');
cx.className = 'cartao f-' + (formas[forma] ? forma : 'A');
cx.innerHTML = formas[forma] || formas.A;
document.getElementById('btImprimir').addEventListener('click', () => window.print());
</script>
</body></html>
