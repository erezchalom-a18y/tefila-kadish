<!doctype html><html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kadish · cartão do display</title>
<!--
  display.html — o cartão de 10 × 15 cm, para o display de mesa da sinagoga.

  Ele (11/09): "quero colocar a folha num display, 15cm de altura por 10cm de
  largura, me sugira 3 opções". O panfleto.html continua existindo e é A4, para
  parede; este é o cartãozinho que fica em cima da mesa, perto de quem senta.

  A distância de leitura MUDA TUDO. O A4 na parede é visto a um metro ou mais e
  por isso o código lá tem 80mm. Este fica a meio braço de distância, então o
  código pode ser menor — mas não pode ser pequeno: uma câmera de telefone pede
  uns 3 cm para ler com folga, e papel em cima de mesa pega reflexo.

  As três formas, por ?f=
    A  o código e mais nada   — quem passa, aponta e vai embora
    B  o código e três passos — quem senta e lê
    C  o Kadish e o código    — o hebraico primeiro; é uma sinagoga

  ?lang=pt|en|es|fr|it|de|ru|he    Imprimir: abrir e mandar imprimir.
-->
<script src="./textos-impressos.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
  @page { size: 100mm 150mm; margin: 0; }
  :root{--bg:#f4ede0;--txt:#2a1f15;--soft:#4d3d2d;--fraco:#8a7860;--brass:#8b6a3e;--linha:#c9b894}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e2d4;font-family:Lora,Georgia,serif;color:var(--txt);
       display:flex;justify-content:center;padding:16px}
  .cartao{width:100mm;height:150mm;background:var(--bg);padding:8mm 7mm;
          box-shadow:0 6px 26px rgba(0,0,0,.18);display:flex;flex-direction:column;
          align-items:center;text-align:center;overflow:hidden}
  .marca{font-family:'Frank Ruhl Libre',serif;letter-spacing:.02em}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--soft);line-height:1.3}
  .regua{height:1px;width:54%;background:linear-gradient(to right,transparent,var(--brass),transparent);opacity:.65}
  .qr{border:1px solid var(--linha);border-radius:6px;background:#fff;display:block}
  .legenda{font-family:'Cormorant Garamond',serif;color:var(--soft);line-height:1.35}
  .endereco{font-family:'Cormorant Garamond',serif;color:var(--brass);font-weight:600;letter-spacing:.02em}
  .passo{display:flex;gap:7px;text-align:left;font-size:11px;line-height:1.35;margin-bottom:5px}
  .passo b{font-family:'Cormorant Garamond',serif;color:var(--brass);font-size:13px;flex:0 0 11px}
  .heb{font-family:'Frank Ruhl Libre',serif;direction:rtl;line-height:1.5}
  .heb-tl{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--soft)}
  .nota{font-family:'Cormorant Garamond',serif;color:var(--fraco);line-height:1.35}
  .rodape{margin-top:auto;font-family:'Cormorant Garamond',serif;color:var(--fraco)}

  /* ---- A · o codigo e mais nada ---- */
  .f-A .marca{font-size:25px}
  .f-A .sub{font-size:12.5px;margin-top:3px}
  .f-A .regua{margin:5mm 0 0}
  .f-A .qr{width:62mm;height:62mm;margin:6mm 0 0}
  .f-A .legenda{font-size:12.5px;margin-top:4mm}
  .f-A .endereco{font-size:17px;margin-top:2mm}

  /* ---- B · o codigo e tres passos ---- */
  .f-B .marca{font-size:21px}
  .f-B .sub{font-size:11px;margin-top:2px}
  .f-B .qr{width:46mm;height:46mm;margin:4mm 0 0}
  .f-B .endereco{font-size:14px;margin-top:2mm}
  .f-B .passos{margin-top:4mm;width:100%}
  .f-B .nota{font-size:10px;margin-top:3mm}

  /* ---- C · o Kadish e o codigo ---- */
  .f-C .heb{font-size:19px;margin-top:1mm}
  .f-C .heb-tl{font-size:11.5px;margin-top:1px}
  .f-C .regua{margin:4mm 0 0}
  .f-C .marca{font-size:16px;margin-top:4mm}
  .f-C .sub{font-size:11px;margin-top:2px}
  .f-C .qr{width:50mm;height:50mm;margin:4mm 0 0}
  .f-C .endereco{font-size:15px;margin-top:2mm}

  /* ---- D e E · as completas: tudo o que a folha A4 diz, no cartao ---- */
  .colunas{display:flex;gap:4mm;width:100%;text-align:left;margin-top:4mm}
  .col{flex:1;min-width:0}
  .col h2{font-family:'Cormorant Garamond',serif;font-size:11.5px;font-weight:600;
          color:var(--brass);margin:0 0 2px}
  .lista{margin:0;padding-left:11px;font-size:8.6px;line-height:1.32}
  .lista li{margin-bottom:1.6px}
  .nota-minyan{margin-top:3mm;padding:2mm 2.5mm;border-radius:5px;
               border:1px solid var(--linha);border-left:3px solid var(--brass);
               background:rgba(212,162,90,.10);font-size:8.4px;line-height:1.35;
               color:var(--soft);text-align:center}
  html[dir=rtl] .colunas{text-align:right}
  html[dir=rtl] .lista{padding-left:0;padding-right:11px}
  html[dir=rtl] .nota-minyan{border-left:1px solid var(--linha);border-right:3px solid var(--brass)}

  .f-D .marca{font-size:19px}
  .f-D .sub{font-size:9.6px;margin-top:2px}
  .f-D .qr{width:38mm;height:38mm;margin:3mm 0 0}
  .f-D .endereco{font-size:14px;margin-top:1.5mm}
  .f-D .passo{font-size:8.6px;line-height:1.32;margin-bottom:3px}
  .f-D .passo b{font-size:11px;flex:0 0 9px}

  .f-E .heb{font-size:15px}
  .f-E .heb-tl{font-size:9px}
  .f-E .regua{margin:2.5mm 0 0}
  .f-E .marca{font-size:17px;margin-top:2.5mm}
  .f-E .qr{width:34mm;height:34mm;margin:2.5mm 0 0}
  .f-E .endereco{font-size:13px;margin-top:1.5mm}
  .f-E .passo{font-size:8.4px;line-height:1.3;margin-bottom:3px}
  .f-E .passo b{font-size:10.5px;flex:0 0 9px}

  .rodape{font-size:9.5px;padding-top:3mm}
  .imprimir{position:fixed;top:14px;right:14px;background:var(--brass);color:#fff;
            border:0;border-radius:8px;padding:9px 15px;font-family:Lora,serif;font-size:13px;cursor:pointer}
  @media print{ body{background:#fff;padding:0} .cartao{box-shadow:none} .imprimir{display:none} }
  html[dir=rtl] .passo{text-align:right}
</style></head>
<body>
<button class="imprimir" id="btImprimir">imprimir</button>
<div class="cartao" id="cartao"></div>
<script>
// Nas 8 linguas. As frases vem do panfleto.html — sao as MESMAS palavras, para
// o cartao e a folha nao dizerem coisas diferentes na mesma sinagoga.
const T = window.TEXTOS_IMPRESSOS;
const q = new URLSearchParams(location.search);
const lingua = (q.get('lang') || 'pt').toLowerCase();
const forma = (q.get('f') || 'A').toUpperCase();
const t = T[lingua] || T.pt;
document.documentElement.lang = lingua;
document.documentElement.dir = t.dir;
const esc = x => String(x).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const QR = '<img class="qr" src="./qr/kadish.svg" alt="QR">';
const ENDERECO = '<div class="endereco">kadish.app</div>';
// `nota` e a frase do minyan e `rodape` e o "Gratuito · sem cadastro" — sao
// campos diferentes na tabela compartilhada. Na primeira volta eu pus `nota`
// aqui e a frase do minyan saiu DUAS VEZES no mesmo cartao: na caixa e no
// rodape. A medida nao viu (nada transbordava); a foto viu.
const RODAPE = `<div class="rodape">${esc(t.rodape)}</div>`;
const HEB = '<div class="heb">יִתְגַּדַּל וְיִתְקַדַּשׁ שְׁמֵהּ רַבָּא</div>' +
            '<div class="heb-tl">Yitgadal veyitkadash shemê raba</div>';
// 11/09 — "achei que ficou muito curto, favor incluir as explicacoes e mais
// features". As formas D e E poem no cartao o MESMO conteudo do A4: os tres
// passos, os cinco itens do que o app faz, e a nota do minyan. Cabe porque as
// duas listas vao LADO A LADO — 100mm de largura sao 86mm uteis, e empilhar as
// duas gastaria altura que o cartao nao tem.
const DUAS_COLUNAS = (t) => `<div class="colunas">
   <div class="col"><h2>${esc(t.hComo)}</h2>${t.passos.map((p,i)=>
      `<div class="passo"><b>${i+1}</b><span>${esc(p)}</span></div>`).join('')}</div>
   <div class="col"><h2>${esc(t.hOque)}</h2><ul class="lista">${t.oque.map(x=>
      `<li>${esc(x)}</li>`).join('')}</ul></div>
 </div>`;
const NOTA_MINYAN = (t) => `<div class="nota-minyan">${esc(t.nota)}</div>`;

const formas = {
 A: `<div class="marca">Kadish</div><div class="sub">${esc(t.sub)}</div>
     <div class="regua"></div>${QR}
     <div class="legenda">${esc(t.qr)}</div>${ENDERECO}${RODAPE}`,
 B: `<div class="marca">Kadish</div><div class="sub">${esc(t.sub)}</div>
     ${QR}${ENDERECO}
     <div class="passos">${t.passos.map((p,i)=>
        `<div class="passo"><b>${i+1}</b><span>${esc(p)}</span></div>`).join('')}</div>
     ${RODAPE}`,
 D: `<div class="marca">Kadish</div><div class="sub">${esc(t.sub)}</div>
     ${QR}${ENDERECO}${DUAS_COLUNAS(t)}${NOTA_MINYAN(t)}${RODAPE}`,
 E: `${HEB}<div class="regua"></div>
     <div class="marca">Kadish</div>
     ${QR}${ENDERECO}${DUAS_COLUNAS(t)}${NOTA_MINYAN(t)}${RODAPE}`,
 C: `${HEB}<div class="regua"></div>
     <div class="marca">Kadish</div><div class="sub">${esc(t.sub)}</div>
     ${QR}${ENDERECO}${RODAPE}`,
};
const cx = document.getElementById('cartao');
cx.className = 'cartao f-' + (formas[forma] ? forma : 'A');
cx.innerHTML = formas[forma] || formas.A;
document.getElementById('btImprimir').addEventListener('click', () => window.print());
</script>
</body></html>
