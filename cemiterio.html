<!doctype html><html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kadish · folheto do cemitério</title>
<!--
  cemiterio.html — O FOLHETO DA CHEVRA KADISHA (14/09).

  Ele: "gostaria de criar um folheto para ser distribuido no cemiterio,
  incentivando a pessoa a falar o kadish pelo ente querido".

  A PRIMEIRA VOLTA ERROU, e ele disse por que: "achei muito forcado, pensei em
  algo mais simples explicando o que e o kadish e o porque fazemos e o que voce
  colocou na primeira pagina". Eu tinha montado DUAS faces com as duas secoes
  mais emocionais dele — a do nome como ponte e a dos dias dificeis ("havera
  dias em que sera facil. E havera dias em que sera dificil"). Cada uma e boa
  onde ele a escreveu, na pagina Aprender, para quem ja esta rezando ha semanas
  e escolheu ler. Empilhadas num papel entregue no cemiterio, no dia, elas
  empurram. **Incentivar nao e insistir.** Quem chega ali nao precisa ser
  comovido — ja esta. Precisa saber o que e aquilo e por que se faz.

  ENTAO E UMA FACE SO, e o miolo e UMA secao dele: a [1], "Por que recitar o
  Kadish por quem partiu?". Ela responde as DUAS perguntas que ele pediu, e
  nessa ordem: abre dizendo o que o Kadish e ("uma das oracoes mais importantes
  da tradicao judaica... escrito em aramaico... a palavra Kadish vem da raiz
  k-d-sh") e fecha dizendo por que se faz ("ao recitar o Kadish, o enlutado
  transforma sua dor em uma afirmacao de fe e de continuidade"). E o paragrafo
  do meio e o que tira o peso: "ele nao fala sobre a morte".

  O resto da pagina e o que ja estava na primeira face, que ele mandou manter:
  o nome, a frase do alto, o codigo e o endereco.

  O TEXTO E LIDO DO aprender.json EM TEMPO DE GERACAO, nunca copiado para ca.
  Se fosse copiado, no dia em que ele corrigisse uma palavra na pagina Aprender
  o papel continuaria dizendo a versao velha, calado — e isso e exatamente o
  defeito que obrigou o textos-impressos.js a existir em 11/09. Aqui e pior,
  porque o texto e dele e ninguem perceberia a divergencia.
  O gerador PROVA, a cada rodada, que o que saiu no papel bate palavra por
  palavra com o aprender.json.

  A escolha de QUAL secao entra e MINHA, e so isso — espera o olho dele.
  As duas que sairam continuam inteiras na pagina Aprender; se ele quiser a
  versao de duas faces de volta, ela esta a um `git revert` de distancia.

  A5 (148 x 210 mm), UMA face. A5 e meia folha de A4: a grafica tira dois por
  folha, e cabe na mao de quem esta de casaco com a familia em volta. O A4
  solto foi justamente o que eu critiquei no folheto do ChatGPT em 13/09.
-->
<script src="./textos-impressos.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
  @page { size: 148mm 210mm; margin: 0; }
  /* 14/09 — sem isto o papel sai SEM FUNDO. Todo navegador descarta cor de
     fundo ao imprimir, por padrao de fabrica. Ver o mesmo bloco no
     panfleto.html e no display.html. */
  *{ -webkit-print-color-adjust: exact; print-color-adjust: exact; box-sizing:border-box }
  :root{--bg:#f4ede0;--txt:#2a1f15;--soft:#4d3d2d;--fraco:#8a7860;--brass:#8b6a3e;--linha:#c9b894}
  body{margin:0;background:#8a8a8a;font-family:'Lora',Georgia,serif;
       display:flex;flex-direction:column;align-items:center;gap:10mm;padding:10mm 0}
  .face{width:148mm;height:210mm;background:var(--bg);color:var(--txt);
        padding:14mm 13mm;overflow:hidden;position:relative;
        display:flex;flex-direction:column;align-items:center;text-align:center;
        box-shadow:0 2px 14px rgba(0,0,0,.25)}
  .marca{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;
         letter-spacing:.03em;line-height:1}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13.5px;
       color:var(--soft);margin-top:4px;max-width:104mm;line-height:1.42}
  .regua{width:26mm;height:1px;background:var(--linha);margin:6mm 0 0}
  h2{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;
     color:var(--brass);margin:6mm 0 3mm;letter-spacing:.02em}
  .corpo{font-size:10.4px;line-height:1.62;color:var(--txt);text-align:left;
         max-width:112mm}
  .corpo p{margin:0 0 2.4mm}
  .corpo p:last-child{margin-bottom:0}
  .qr{width:38mm;height:38mm;margin:5mm 0 0;display:block}
  .endereco{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;
            letter-spacing:.04em;margin-top:1.5mm}
  .legenda{font-size:9.6px;color:var(--fraco);margin-top:1.5mm;max-width:100mm}
  .lista{list-style:none;padding:0;margin:4mm 0 0;text-align:left;max-width:108mm}
  .lista li{font-size:10.4px;line-height:1.5;margin-bottom:2mm;padding-left:5mm;position:relative}
  .lista li::before{content:'·';position:absolute;left:1.5mm;color:var(--brass);font-weight:700}
  .nota{font-size:9.4px;line-height:1.5;color:var(--soft);margin-top:auto;
        padding-top:4mm;max-width:112mm;border-top:1px solid var(--linha)}
  .rodape{font-family:'Cormorant Garamond',serif;font-size:10px;color:var(--fraco);
          letter-spacing:.05em;margin-top:2.5mm}
  [dir=rtl] .corpo, [dir=rtl] .lista{text-align:right}
  [dir=rtl] .lista li{padding-left:0;padding-right:5mm}
  [dir=rtl] .lista li::before{left:auto;right:1.5mm}
  @media print{ body{background:#fff;padding:0;gap:0}
                .face{box-shadow:none;page-break-after:always}
                .face:last-child{page-break-after:auto} }
</style>
</head>
<body>
<div class="face" id="frente"></div>
<script>
const q = new URLSearchParams(location.search);
const lingua = q.get('lang') || 'pt';
const t = (window.TEXTOS_IMPRESSOS[lingua] || window.TEXTOS_IMPRESSOS.pt);
document.documentElement.lang = lingua;
document.documentElement.dir = t.dir;
const esc = x => String(x).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Pula uma linha vazia = paragrafo novo. E a mesma regra do aprender.html.
const paras = txt => txt.split(/\n\s*\n/).map(p => `<p>${esc(p.trim())}</p>`).join('');

// AS SECOES SAO ESCOLHIDAS POR POSICAO, nunca pelo titulo — o titulo muda de
// lingua e o indice nao. Mesma regra dos pop-ups das tres portas (10/09).
//   [1] "Por que recitar o Kadish por quem partiu?"
// Ela responde as duas perguntas dele numa so: abre com o que o Kadish E e
// fecha com por que se FAZ.
const SECAO = 1;

fetch('./aprender.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
  const sec = i => {
    const s = d.secoes[i];
    const tit = s.titulo[lingua] || s.titulo.pt;
    const corp = s.corpo[lingua] || s.corpo.pt;
    return `<h2>${esc(tit)}</h2><div class="corpo">${paras(corp)}</div>`;
  };
  document.getElementById('frente').innerHTML =
    `<div class="marca">Kadish</div><div class="sub">${esc(t.sub)}</div>` +
    `<div class="regua"></div>` + sec(SECAO) +
    `<img class="qr" src="./qr/kadish.svg" alt="QR">` +
    `<div class="endereco">kadish.app</div>` +
    `<div class="legenda">${esc(t.qr)}</div>` +
    // A nota do minyan fica, e calada (sem a caixa): e a unica coisa que ele
    // precisa saber ANTES de tentar rezar sozinho em casa.
    `<div class="nota">${esc(t.nota)}</div>` +
    `<div class="rodape">${esc(t.rodape)}</div>`;
  document.body.dataset.pronto = '1';
});
</script>
</body></html>
