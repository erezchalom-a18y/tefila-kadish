name: Checagens

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v6

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # REGRA 0 DAS INVIOLAVEIS. Vem PRIMEIRO de proposito: se a sincronia que ele
      # aprovou mudou, nada mais importa ate ele autorizar.
      - name: trava-sincronia.mjs (a sincronia e a que ele aprovou?)
        run: node trava-sincronia.mjs

      - name: checar.mjs (estrutura, contagem, ritmo)
        run: node checar.mjs

      - name: checar-ritos.mjs (marcas de rito)
        run: node checar-ritos.mjs

      # Nao gasta nada: roda o worker do Cloudflare sobre o SQLite do proprio Node.
      - name: testar-contador.mjs (o contador geral, sem sair do computador)
        run: node testar-contador.mjs

      - name: O calendario hebraico e a data do yahrzeit
        run: node testar-yahrzeit.mjs

      # Estes dois abrem o app num Chromium de verdade. Foram acrescentados
      # depois que dois defeitos passaram pelas checagens de dados e so
      # apareceram na tela: a voz sintetizada no lugar do rabino, e o painel
      # explicativo saindo em portugues para quem lia noutra lingua.
      - name: Instalar Playwright e o Chromium
        run: npm install playwright && npx playwright install --with-deps chromium

      # Tem que ser este servidor, e nao o `python3 -m http.server`: aquele nao
      # responde a pedidos Range, e sem Range o navegador nao consegue mover o
      # audio — todo seek cai no zero. O teste do Modo Treino chegou a dar
      # verde medindo essa ficcao. O GitHub Pages responde Range; o teste
      # tambem precisa responder.
      - name: Servir o repositorio de subdiretorio (como o GitHub Pages)
        run: |
          node servidor-teste.mjs 8896 "$GITHUB_WORKSPACE" &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8896/tefila-kadish/engine.html -o /dev/null && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-99' \
            http://127.0.0.1:8896/tefila-kadish/tefila-audio/chabad/yatom.mp3)
          test "$code" = "206" || { echo "servidor sem Range (deu $code)"; exit 1; }

      - name: testar-app.mjs (as 8 combinacoes, nos 2 formatos de audio)
        run: node testar-app.mjs http://127.0.0.1:8896/tefila-kadish

      - name: testar-linguas.mjs (a tela inteira nas 8 linguas)
        run: node testar-linguas.mjs http://127.0.0.1:8896/tefila-kadish

      - name: testar-telas.mjs (7 tamanhos de tela, em pe e deitado)
        run: node testar-telas.mjs http://127.0.0.1:8896/tefila-kadish

      - name: testar-dedicatoria.mjs (o convite "em memoria de" nas 8 linguas)
        run: node testar-dedicatoria.mjs http://127.0.0.1:8896/tefila-kadish

      - name: testar-camadas.mjs (a fita das camadas e o ⚙ dizem a mesma coisa)
        run: node testar-camadas.mjs http://127.0.0.1:8896/tefila-kadish

      - name: testar-treino.mjs (Modo Treino e repeticao)
        run: node testar-treino.mjs http://127.0.0.1:8896/tefila-kadish

      - name: testar-revisar.mjs (a pagina de revisao das linguas)
        run: node testar-revisar.mjs http://127.0.0.1:8896/tefila-kadish

      - name: testar-portugues.mjs (o portugues decidido pelo Erez, nos 8)
        run: node testar-portugues.mjs http://127.0.0.1:8896/tefila-kadish

      - name: A pagina Aprender, e o texto que e dele
        run: node testar-aprender.mjs http://127.0.0.1:8896/tefila-kadish

      - name: checar-sincronia.mjs (a sincronia dos 8, sem navegador)
        run: node checar-sincronia.mjs

      # Trocar de Kadish e de modo NO MEIO da reza, oito trocas seguidas sem
      # recarregar a pagina. Ficou fora daqui entre 30/08 e o conserto, porque o
      # conserto tinha sido desfeito a pedido dele; volta junto com ele.
      - name: checar-trocas.mjs (trocar de Kadish e de modo no meio da reza)
        run: node checar-trocas.mjs http://127.0.0.1:8896/tefila-kadish

      - name: testar-sincronia.mjs (a pagina que mostra a voz)
        run: node testar-sincronia.mjs http://127.0.0.1:8896/tefila-kadish
