name: Revisao cega do glossario

# Roda SOMENTE quando glossario.json muda (ou quando disparada a mao).
# Uma rodada por mudanca. O commit do relatorio nao mexe em glossario.json,
# entao nao se re-dispara: nunca entra em loop.
on:
  push:
    branches: [main]
    paths:
      - glossario.json
  workflow_dispatch:

# Uma execucao por vez; se chegarem duas mudancas juntas, a antiga e cancelada.
concurrency:
  group: revisao-glossario
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v6

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Revisar o glossario as cegas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: node revisar-glossario-gpt.mjs

      - name: Revisar a transliteracao as cegas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: node revisar-glossario-gpt.mjs --transliteracao

      - name: Commitar o relatorio
        run: |
          # git diff NAO enxerga arquivo novo (nao rastreado); status --porcelain enxerga.
          if [ -z "$(git status --porcelain -- RELATORIO-REVISAO-GPT.md RELATORIO-TRANSLITERACAO-GPT.md)" ]; then
            echo "relatorio sem mudanca; nada a commitar"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELATORIO-REVISAO-GPT.md RELATORIO-TRANSLITERACAO-GPT.md
          git commit -m "Relatorios da revisao cega: glossario e transliteracao (automatico)"
          # As duas revisoes podem terminar juntas e empurrar para a main ao mesmo
          # tempo; sem rebase, a segunda leva rejeicao de nao-fast-forward.
          for tentativa in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push recusado, tentando de novo ($tentativa/3)"
            sleep 5
          done
          echo "nao consegui empurrar o relatorio"
          exit 1
