name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revise este pull request, com atencao a:
            - Qualidade do codigo e boas praticas
            - Possiveis bugs ou problemas
            - Implicacoes de seguranca
            - Consideracoes de performance

            Nota: o branch do PR ja esta com checkout feito no diretorio atual.

            Use `gh pr comment` para o comentario geral.
            Use `mcp__github_inline_comment__create_inline_comment` (com `confirmed: true`) para apontar trechos especificos.
            Publique apenas comentarios no GitHub - nao entregue a revisao como mensagem.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
